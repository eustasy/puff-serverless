<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="htmx-config"
      content='{"responseHandling": [
      {"code":"200", "swap": true},
      {"code":"400", "swap": true},
      {"code":"401", "swap": true},
      {"code":"403", "swap": true},
      {"code":"404", "swap": true},
      {"code":"405", "swap": true},
      {"code":"500", "swap": true}
    ]
    }'
    />
    <title>Logout</title>
    <script src="/assets/htmx_2.0.4.min.js"></script>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <div class="container">
      <h1>Logout</h1>
      <p>Click the button below to log out of your current session.</p>
      <button
        id="logoutButton"
        class="btn-danger"
        hx-post="/api/user/logout"
        hx-target="#logout-result"
        hx-disabled-elt="#logoutButton"
      >
        Log Out
        <img class="htmx-indicator" src="/assets/bars.svg" />
      </button>
      <div id="logout-result" class="result-area"></div>
      <p class="centered-link"><a href="/login.html">Go to Login Page</a></p>
    </div>
  </body>
</html>
