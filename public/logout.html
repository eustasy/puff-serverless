<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <script src="/assets/htmx_4.0.0-beta4.min.js"></script>
    <link rel="stylesheet" href="/assets/main.css">
  </head>
  <body>
    <div class="container">
      <h1>Logout</h1>
      <p>Click the button below to log out of your current session.</p>
      <button
        type="button"
        id="logoutButton"
        class="btn-danger"
        hx-post="/api/user/logout"
        hx-target="#logout-result"
        hx-disable="#logoutButton"
      >
        Log Out
        <img class="htmx-indicator" src="/assets/bars.svg" alt="">
      </button>
      <div id="logout-result" class="result-area"></div>
      <p class="centered-link"><a href="/login">Go to Login Page</a></p>
    </div>
  </body>
</html>
