<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="htmx-config"
      content='{"responseHandling": [
      {"code":"200", "swap": true},
      {"code":"400", "swap": true},
      {"code":"401", "swap": true},
      {"code":"403", "swap": true},
      {"code":"404", "swap": true},
      {"code":"405", "swap": true},
      {"code":"500", "swap": true}
    ]
    }'
    />
    <title>Login</title>
    <script src="/assets/htmx_2.0.4.min.js"></script>
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <div id="message-area" class="result-area"></div>
      <form
        hx-validate="true"
        hx-post="/api/db/user/login"
        hx-target="#login-result"
        hx-include="[name='email'], [name='pw']"
        hx-disabled-elt=".btn-safe"
      >
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="pw">Password:</label>
          <input
            type="password"
            id="pw"
            name="pw"
            placeholder="Password"
            required
          />
        </div>
        <button type="submit" class="btn-safe">
          Log In
          <img class="htmx-indicator" src="/assets/bars.svg" />
        </button>
      </form>
      <div id="login-result" class="result-area"></div>
      <p class="centered-link">
        Don't have an account? <a href="/register">Register</a>
      </p>
      <p class="centered-link">
        Forgot your password? <a href="/reset/request">Reset it</a>
      </p>
      <p class="centered-link-secondary">
        Go to <a href="/logout">Logout</a> Page
      </p>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search)
        const message = params.get("message")
        if (message) {
          const messageArea = document.getElementById("message-area")
          // Sanitize the message before displaying it to prevent XSS
          const sanitizedMessage = decodeURIComponent(message)
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
          messageArea.innerHTML = `<p class=\\"success\\">${sanitizedMessage}</p>`
        }
      })
    </script>
  </body>
</html>
