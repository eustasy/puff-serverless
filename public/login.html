<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="assets/htmx_2.0.4.min.js"></script>
    <link rel="stylesheet" href="assets/main.css" />
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <form
        hx-validate="true"
        hx-post="/api/user/login"
        hx-target="#login-result"
        hx-include="[name='email'], [name='pw']"
        hx-disabled-elt=".btn-login"
      >
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="pw">Password:</label>
          <input
            type="password"
            id="pw"
            name="pw"
            placeholder="Password"
            required
          />
        </div>
        <button type="submit" class="btn-login">
          Log In
          <img class="htmx-indicator" src="/assets/bars.svg" />
        </button>
      </form>
      <div id="login-result" class="result-area"></div>
      <p class="centered-link">
        <a href="/register.html">Don't have an account? Register</a>
      </p>
      <p class="centered-link-secondary">
        <a href="/logout.html">Go to Logout Page</a>
      </p>
    </div>
  </body>
</html>
