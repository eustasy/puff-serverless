<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="htmx_1.9.7.min.js"></script>
</head>
<body>
    <h1>Login</h1>
    <form>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="you@email.com" required>
        </div>
        <div>
            <label for="pw">Password:</label>
            <input type="password" id="pw" name="pw" placeholder="Password" required>
        </div>
        <input type="submit" value="Log In" hx-post="/api/user_login" hx-trigger="click" hx-include="[name='email'], [name='pw']" hx-target="#login-result">
    </form>
    <div id="login-result"></div>
</body>
</html>
