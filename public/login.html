<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="/assets/htmx_4.0.0-beta4.min.js"></script>
    <script src="/assets/webauthn.js" defer></script>
    <link rel="stylesheet" href="/assets/main.css">
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <div id="message-area" class="result-area" hx-trigger="load" hx-swap="innerHTML"></div>
      <script>
        // Set hx-get to /api/messages plus the current query string (CSP-safe, no eval)
        const msgArea = document.getElementById("message-area")
        if (msgArea) {
          msgArea.setAttribute("hx-get", "/api/messages" + window.location.search)
        }
      </script>
      <form
        hx-validate="true"
        hx-post="/api/user/login"
        hx-target="#login-result"
        hx-include="[name='email'], [name='pw']"
        hx-disable=".btn-safe"
      >
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email webauthn" required>
        </div>
        <div class="form-group">
          <label for="pw">Password:</label>
          <input type="password" id="pw" name="pw" placeholder="Password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-safe">
          Log In
          <img class="htmx-indicator" src="/assets/bars.svg" alt="">
        </button>
      </form>
      <div id="login-result" class="result-area"></div>

      <hr>
      <p>Sign in with a passkey for the email above:</p>
      <button type="button" id="passkey-login-btn" class="btn-safe">Use Passkey</button>
      <div id="passkey-result" class="result-area"></div>

      <div id="federated-providers" hx-get="/api/providers" hx-trigger="load" hx-swap="innerHTML"></div>

      <p class="centered-link">Don't have an account? <a href="/register">Register</a></p>
      <p class="centered-link">Forgot your password? <a href="/reset/request">Reset it</a></p>
      <p class="centered-link-secondary">Go to <a href="/logout">Logout</a> Page</p>
    </div>
  </body>
</html>
