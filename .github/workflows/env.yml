# eustasy/.Normal 4.0beta16
name: "Normal: Env"
on:
  workflow_dispatch:
  push:
    branches: [cf-pages]
    paths:
      - ".env*"
      - ".github/workflows/env.yml"
      - ".qlty/qlty.toml"
  pull_request:
    branches: [cf-pages]
    paths:
      - ".env*"
      - ".github/workflows/env.yml"
      - ".qlty/qlty.toml"

permissions:
  contents: read

jobs:
  env:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/env@v4
