# eustasy/.Normal 4.0beta16
name: "Type: TS"
on:
  workflow_dispatch:
  push:
    branches: [cf-pages]
    paths:
      - "**.js"
      - "**.ts"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.cts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/type-js.yml"
  pull_request:
    branches: [cf-pages]
    paths:
      - "**.js"
      - "**.ts"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.cts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/type-js.yml"

permissions:
  contents: read

jobs:
  type-js:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/js/setup@v4

      - name: Generate types
        # wrangler emits the Worker/binding types tsc needs; without this the
        # typecheck fails on missing Env and binding declarations.
        run: npm run types

      - name: Typecheck
        run: npm run typecheck
