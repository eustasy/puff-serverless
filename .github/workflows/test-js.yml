# eustasy/.Normal 4.0beta15
name: "Test: JS / TS"
on:
  workflow_dispatch:
  push:
    branches: [cf-pages]
    paths:
      - "**.js"
      - "**.ts"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.cts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-js.yml"
  pull_request:
    branches: [cf-pages]
    paths:
      - "**.js"
      - "**.ts"
      - "**.mjs"
      - "**.cjs"
      - "**.mts"
      - "**.cts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-js.yml"

permissions:
  contents: read

jobs:
  test-js:
    name: Vitest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/js/setup@v4

      # Insert project-specific steps here — fixtures, config files, migrations.

      - uses: eustasy/.normal/js/test@v4
        with:
          coverage-token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
